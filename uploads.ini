; ==========================================================================
; SolarTechonolgy — límites PHP + endurecimiento (README §uploads.ini)
; Montado en /usr/local/etc/php/conf.d/uploads.ini
; ==========================================================================

; --- Límites de subida / memoria ------------------------------------------
file_uploads = On
upload_max_filesize = 32M
post_max_size = 48M
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
max_input_vars = 3000

; --- Ocultar versión de PHP -----------------------------------------------
expose_php = Off

; --- Sesiones más seguras -------------------------------------------------
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = "Lax"

; --- Deshabilitar funciones peligrosas (anti-shell / RCE) -----------------
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source,pcntl_exec,dl,eval
