; ==========================================================================
; SolarTechonolgy — equivalente de uploads.ini para hosting con cPanel.
; Se copia como `.user.ini` en la raíz del sitio al armar el paquete
; (deploy/build.ps1). PHP-FPM lo lee automáticamente; los cambios pueden
; tardar hasta 5 minutos en aplicarse (user_ini.cache_ttl).
;
; NOTA: `disable_functions` NO se puede fijar aquí (es PHP_INI_SYSTEM).
; Configúralo en cPanel → MultiPHP INI Editor con esta lista conservadora:
;   passthru,shell_exec,system,popen,show_source,pcntl_exec,dl
; La lista de uploads.ini (con proc_open, exec y curl_multi_exec) es para el
; contenedor: en hosting compartido suele romper el panel y las actualizaciones.
; ==========================================================================

; --- Límites de subida / memoria ------------------------------------------
file_uploads        = On
upload_max_filesize = 32M
post_max_size       = 48M
max_execution_time  = 120
max_input_time      = 120
memory_limit        = 256M
max_input_vars      = 3000

; --- Ocultar versión de PHP -----------------------------------------------
expose_php = Off

; --- Sin errores en pantalla (producción) ---------------------------------
display_errors       = Off
display_startup_errors = Off
log_errors           = On

; --- Sesiones más seguras -------------------------------------------------
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = "Lax"
